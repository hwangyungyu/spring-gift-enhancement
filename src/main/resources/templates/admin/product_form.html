<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${formType == 'add'} ? '상품 등록' : '상품 수정'"></title>
</head>
<body>

<form th:if="${formType == 'add'}"
      th:action="@{/admin/products}"
      method="post"
      th:object="${product}">
  <label>
    상품 이름:
    <input type="text" th:field="*{name}" />
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
  </label><br>

  <label>
    가격:
    <input type="number" th:field="*{price}" />
    <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
  </label><br>

  <label>
    이미지 URL:
    <input type="text" th:field="*{imageUrl}" />
    <span th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></span>
  </label><br>

  <label>
    '카카오' 사용 MD 협의 완료:
    <input type="checkbox" th:field="*{MDapproved}" />
  </label><br>

  <h3>옵션 목록</h3>
  <div th:each="opt, iterStat : *{options}">
    <label>
      옵션 이름:
      <input type="text" th:field="*{options[__${iterStat.index}__].name}" />
    </label>
    <label>
      수량:
      <input type="number" th:field="*{options[__${iterStat.index}__].quantity}" />
    </label>
    <br>
  </div>

  <!-- 빈 옵션 3개 기본 제공 -->
  <div th:if="${#lists.isEmpty(product.options)}">
    <label>옵션 이름: <input type="text" name="options[0].name" /></label>
    <label>수량: <input type="number" name="options[0].quantity" /></label><br>

    <label>옵션 이름: <input type="text" name="options[1].name" /></label>
    <label>수량: <input type="number" name="options[1].quantity" /></label><br>

    <label>옵션 이름: <input type="text" name="options[2].name" /></label>
    <label>수량: <input type="number" name="options[2].quantity" /></label><br>
  </div>

  <button type="submit">등록</button>
</form>

<form th:if="${formType == 'edit'}"
      th:action="@{/admin/products/{id}(id=${product.id})}"
      method="post"
      th:object="${product}">
  <label>
    상품 이름:
    <input type="text" th:field="*{name}" />
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
  </label><br>

  <label>
    가격:
    <input type="number" th:field="*{price}" />
    <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
  </label><br>

  <label>
    이미지 URL:
    <input type="text" th:field="*{imageUrl}" />
    <span th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></span>
  </label><br>

  <label>
    '카카오' 사용 MD 협의 완료:
    <input type="checkbox" th:field="*{MDapproved}" />
  </label><br>

  <h3>옵션 목록</h3>
  <div th:each="opt, iterStat : *{options}">
    <label>
      옵션 이름:
      <input type="text" th:field="*{options[__${iterStat.index}__].name}" />
    </label>
    <label>
      수량:
      <input type="number" th:field="*{options[__${iterStat.index}__].quantity}" />
    </label>
    <br>
  </div>

  <!-- 빈 옵션 3개 기본 제공 -->
  <div th:if="${#lists.isEmpty(product.options)}">
    <label>옵션 이름: <input type="text" name="options[0].name" /></label>
    <label>수량: <input type="number" name="options[0].quantity" /></label><br>

    <label>옵션 이름: <input type="text" name="options[1].name" /></label>
    <label>수량: <input type="number" name="options[1].quantity" /></label><br>

    <label>옵션 이름: <input type="text" name="options[2].name" /></label>
    <label>수량: <input type="number" name="options[2].quantity" /></label><br>
  </div>

  <button type="submit">수정</button>
</form>

<a th:href="@{/admin/products}">목록으로 돌아가기</a>

</body>
</html>
